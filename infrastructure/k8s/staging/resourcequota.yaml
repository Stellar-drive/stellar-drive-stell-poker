# Namespace-wide ceiling for staging (Issue #674).
#
# Sized from the Helm chart values at their HPA maximums plus one surge pod per
# Deployment during a rolling update (see README.md for the worked numbers).
# scripts/check_k8s_quota.py recomputes that worst case from the charts in CI
# and fails if a values.yaml change would no longer fit.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stellar-drive-stell-poker-staging-compute
  namespace: stellar-drive-stell-poker-staging
  labels:
    app.kubernetes.io/part-of: stellar-drive-stell-poker
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "14"
    limits.memory: 12Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stellar-drive-stell-poker-staging-storage
  namespace: stellar-drive-stell-poker-staging
  labels:
    app.kubernetes.io/part-of: stellar-drive-stell-poker
spec:
  hard:
    # soroban-rpc-proxy ledger (20Gi) + circuits and CRS volumes for mpc-node.
    requests.storage: 100Gi
    persistentvolumeclaims: "6"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stellar-drive-stell-poker-staging-objects
  namespace: stellar-drive-stell-poker-staging
  labels:
    app.kubernetes.io/part-of: stellar-drive-stell-poker
spec:
  hard:
    services: "10"
    # Traffic enters through the shared ingress controller; staging should
    # never provision its own cloud load balancers or expose node ports.
    services.loadbalancers: "0"
    services.nodeports: "0"
    configmaps: "30"
    secrets: "30"
