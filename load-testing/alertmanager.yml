route:
  group_by: ["alertname", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: slack-warning

receivers:
  - name: default
    slack_configs:
      - api_url: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX"
        channel: "#mpc-alerts"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "YOUR_PAGERDUTY_INTEGRATION_KEY"
        severity: critical
        description: '{{ .GroupLabels.alertname }} - {{ .Annotations.summary }}'
        client: stellar-drive-stell-poker MPC
        client_url: "https://github.com/Stellar-drive/stellar-drive-stell-poker"
        images:
          - src: "https://raw.githubusercontent.com/Stellar-drive/stellar-drive-stell-poker/main/assets/mpc-alert-icon.png"
            href: "https://github.com/Stellar-drive/stellar-drive-stell-poker"
        send_resolved: true

  - name: slack-warning
    slack_configs:
      - api_url: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX"
        channel: "#mpc-alerts"
        send_resolved: true
        title: '⚠️ {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  - name: email-notifications
    email_configs:
      - to: "mpc-team@stellar-drive-stell-poker.example.com"
        from: "alertmanager@stellar-drive-stell-poker.example.com"
        smarthost: "smtp.example.com:587"
        auth_username: "alertmanager@stellar-drive-stell-poker.example.com"
        auth_identity: "alertmanager@stellar-drive-stell-poker.example.com"
        auth_password: "YOUR_SMTP_PASSWORD"
        send_resolved: true
        headers:
          subject: '{{ .GroupLabels.alertname }} - {{ .Status }}'
