[workspace]
resolver = "2"
members = [
    "contracts/poker-table",
    "contracts/zk-verifier",
    "contracts/committee-registry",
    "contracts/game-hub",
    "contracts/player-rating",
    "contracts/auth-manager",
    "contracts/jackpot-verifier",
    "contracts/table-nft",
    "contracts/liquidity-pool",
    "contracts/tournament-prize-pool",
    "contracts/protocol-governance",
    "contracts/rakeback-rewards",
    "contracts/hand-verifier",
    "contracts/token-gated-table",
    "contracts/protocol-treasury",
    "contracts/governance",
    "stellar-zk-cards",
    "services/coordinator",
    "services/node",
    "circuits/test-vectors",
]

[workspace.dependencies]
soroban-sdk = { git = "https://github.com/stellar/rs-soroban-sdk.git", rev = "acffbbd45be6a0a551146eebfc268d6f95078246" }
stellar-zk-cards = { path = "stellar-zk-cards" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[dev-dependencies]
regex = "1.10"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
